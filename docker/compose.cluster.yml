# Three brokers instead of one, as an override:
#
#   KAFKA_QUORUM=1@kafka:9093,2@kafka2:9093,3@kafka3:9093 \
#   KAFKA_INTERNAL=kafka:19092,kafka2:19092,kafka3:19092 \
#   docker compose -f docker/compose.yml -f docker/compose.cluster.yml up -d --wait
#
# Kept because the measurement is worth being able to repeat, not because it is
# an improvement. On one machine it is slower: the same 8,000,000-order drain
# fell from ~137,000 orders/sec on one broker to ~74,000 on three, and the write
# ceiling measured with four concurrent producers fell from 750,000 records/sec
# to 545,000. Three broker JVMs held 2.5GB of a 7.65GB VM, and Kafka writes are
# only fast while the page cache that leaves behind is large enough. More
# brokers add capacity when they add machines; on one machine they divide it.
#
# Switching between one and three brokers changes the controller quorum, so the
# cluster has to be recreated: docker compose down -v first.
services:
  kafka2:
    image: apache/kafka:3.9.2
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    container_name: ft-kafka2
    ports:
      - "9094:9094"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_QUORUM:-1@kafka:9093,2@kafka2:9093,3@kafka3:9093}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: ZmxpbmstdHJhaW5pbmctMDE
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:19092,HOST://localhost:9094

  kafka3:
    image: apache/kafka:3.9.2
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    container_name: ft-kafka3
    ports:
      - "9095:9095"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_QUORUM:-1@kafka:9093,2@kafka2:9093,3@kafka3:9093}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: ZmxpbmstdHJhaW5pbmctMDE
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,HOST://:9095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:19092,HOST://localhost:9095

  topics:
    depends_on:
      kafka:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy

  jobmanager:
    depends_on:
      kafka:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
