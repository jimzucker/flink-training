# Local stack. Grown one service per step: Kafka at step 02, Flink at step 04,
# Prometheus and Grafana at step 06.
name: flink-training

services:
  kafka:
    image: apache/kafka:3.9.2
    container_name: ft-kafka
    ports:
      - "9092:9092"          # host clients
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly so partition counts are a design decision,
      # not a side effect of whoever produces first.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: ZmxpbmstdHJhaW5pbmctMDE
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Runs once, creates the six topics from the design, then exits.
  topics:
    image: apache/kafka:3.9.2
    container_name: ft-topics
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:19092
      PARTITIONS: "4"
    volumes:
      - ./scripts:/scripts:ro
    restart: "no"

  jobmanager:
    image: flink:1.20.4-java17
    container_name: ft-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"          # web UI and REST
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        parallelism.default: 2
        state.backend.type: hashmap
        execution.checkpointing.interval: 10s
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  taskmanager:
    image: flink:1.20.4-java17
    container_name: ft-taskmanager
    command: taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
    # Comes back on its own after a crash, so a failure is a recovery to watch
    # rather than a stack to rebuild by hand.
    restart: unless-stopped

  # Submits the jobs jar, then exits. Kept out of `up` by a profile so bringing
  # the stack up does not require the jar to have been built yet.
  submit:
    image: flink:1.20.4-java17
    container_name: ft-submit
    profiles: ["submit"]
    depends_on:
      jobmanager:
        condition: service_healthy
    volumes:
      - ../jobs/target:/opt/jobs:ro
    environment:
      # The demo raises parallelism from 2 to 4 to show throughput scaling with
      # it. The job graph is built in the client, so this has to be set here.
      PARALLELISM: "${PARALLELISM:-2}"
      CHECKPOINT_INTERVAL_MS: "${CHECKPOINT_INTERVAL_MS:-5000}"
      BOOTSTRAP_SERVERS: "${BOOTSTRAP_SERVERS:-kafka:19092}"
      WINDOW_MS: "${WINDOW_MS:-60000}"
      IDLENESS_MS: "${IDLENESS_MS:-5000}"
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        flink run -d -m jobmanager:8081 \
          -c io.github.jimzucker.flinktraining.job.PositionsJob \
          /opt/jobs/jobs.jar
        flink run -d -m jobmanager:8081 \
          -c io.github.jimzucker.flinktraining.job.MarketValueJob \
          /opt/jobs/jobs.jar
        flink list -m jobmanager:8081
    restart: "no"
