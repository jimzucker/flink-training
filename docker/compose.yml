# Shared by the three brokers. Each one overrides only its node id and listeners.
x-broker: &broker
  image: apache/kafka:3.9.2
  healthcheck:
    # Against its own internal listener: this asks whether this broker is
    # serving, which is what depends_on needs to know.
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 10s

x-broker-env: &broker-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_QUORUM:-1@kafka:9093}
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  # Topics are created explicitly so partition counts are a design decision,
  # not a side effect of whoever produces first.
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  CLUSTER_ID: ZmxpbmstdHJhaW5pbmctMDE

# Local stack. Grown one service per step: Kafka at step 02, Flink at step 04,
# Prometheus and Grafana at step 06.
name: flink-training

services:
  # One broker, and measurably the right choice on one machine. Three brokers were
  # tried to lift the write ceiling and made it worse: the drain fell from
  # ~137,000 orders/sec to ~74,000, because three JVMs held 2.5GB of a 7.65GB VM
  # and Kafka writes depend on the page cache that leaves behind. Adding brokers
  # buys capacity only when it adds machines.
  #
  # docker/compose.cluster.yml still brings the three-broker cluster up, for
  # repeating that measurement.
  kafka:
    <<: *broker
    container_name: ft-kafka
    ports:
      - "9092:9092"          # host clients
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092

  # Runs once, creates the six topics from the design, then exits.
  topics:
    image: apache/kafka:3.9.2
    container_name: ft-topics
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      BOOTSTRAP: "${KAFKA_INTERNAL:-kafka:19092}"
      # Divisible by three so partitions spread evenly over the brokers, and by
      # four so every parallelism the scale test uses gets whole partitions.
      PARTITIONS: "${PARTITIONS:-12}"
    volumes:
      - ./scripts:/scripts:ro
    restart: "no"

  jobmanager:
    image: flink:1.20.4-java17
    container_name: ft-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"          # web UI and REST
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        parallelism.default: 2
        state.backend.type: hashmap
        execution.checkpointing.interval: 1s
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  taskmanager:
    image: flink:1.20.4-java17
    container_name: ft-taskmanager
    command: taskmanager
    # A core budget, so parallelism has something to convert. Left at the whole
    # machine by default; the scaling demo sets it to 1, 2 and 4 alongside the
    # parallelism, which is what a KPU is in Managed Service for Apache Flink --
    # one vCPU, bought together with the parallelism that uses it.
    deploy:
      resources:
        limits:
          cpus: "${TASKMANAGER_CPUS:-8}"
    depends_on:
      jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: ${TASK_SLOTS:-8}
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    # Comes back on its own after a crash, so a failure is a recovery to watch
    # rather than a stack to rebuild by hand.
    restart: unless-stopped

  # Submits both jobs, then exits. Built from the repository rather than mounting
  # a jar from the host, so `docker compose up` needs nothing built first.
  submit:
    build:
      context: ..
      target: jobs
    image: flink-training/jobs
    container_name: ft-submit
    depends_on:
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_started
      # Submitting before the topics exist fails the job with
      # UnknownTopicOrPartition, and it then restarts in a loop.
      topics:
        condition: service_completed_successfully
    environment:
      # The demo raises parallelism from 2 to 4 to show throughput scaling with
      # it. The job graph is built in the client, so this has to be set here.
      PARALLELISM: "${PARALLELISM:-2}"
      CHECKPOINT_INTERVAL_MS: "${CHECKPOINT_INTERVAL_MS:-1000}"
      BOOTSTRAP_SERVERS: "${KAFKA_INTERNAL:-kafka:19092}"
      # Ten seconds, not the specified minute. This stack is the local demo, and
      # a minute of dead air before the market value sinks say anything is a long
      # time in front of an audience. The job itself still defaults to the
      # specified minute; only this stack overrides it.
      WINDOW_MS: "${WINDOW_MS:-10000}"
      IDLENESS_MS: "${IDLENESS_MS:-5000}"
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        # A task manager registers a moment after its container starts. Without a
        # free slot the submission is rejected for lack of resources, so wait for
        # one rather than race it.
        for _ in $$(seq 1 60); do
          slots=$$(curl -sf http://jobmanager:8081/overview | grep -o '"slots-available":[0-9]*' | cut -d: -f2)
          [ "$${slots:-0}" -ge 1 ] && break
          sleep 2
        done
        flink run -d -m jobmanager:8081 \
          -c io.github.jimzucker.flinktraining.job.PositionsJob \
          /opt/jobs/jobs.jar
        flink run -d -m jobmanager:8081 \
          -c io.github.jimzucker.flinktraining.job.MarketValueJob \
          /opt/jobs/jobs.jar
        flink list -m jobmanager:8081
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: ft-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2h
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  grafana:
    image: grafana/grafana:10.4.19
    container_name: ft-grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # The dashboard is opened and pointed at during a live demo; a login screen
      # in the middle of that is friction with nothing to protect.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: light
      # Server-side rendering, so a dashboard image can be captured without
      # depending on whatever browser happens to be to hand. Also how the
      # dashboard screenshots for the final deck are produced.
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_LOG_FILTERS: rendering:debug
      # Pinned to the 10.4 LTS line. In 11.5 the Scenes dashboard renderer is
      # enabled and cannot be switched off -- the toggles are GA -- and it renders
      # no panels here: the dashboard model is stored correctly and the queries
      # return data, but the panel area stays empty. A dashboard that does not
      # draw is worth nothing during a live demo, so the version is pinned to one
      # that does rather than left on a moving default.
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  renderer:
    image: grafana/grafana-image-renderer:3.11.6
    container_name: ft-renderer
    environment:
      ENABLE_METRICS: "false"

  # Produces the demo load. Waits for the jobs to be submitted, so the topics are
  # being consumed before anything is written to them.
  generators:
    build:
      context: ..
      target: generators
    image: flink-training/generators
    container_name: ft-generators
    depends_on:
      submit:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: "${KAFKA_INTERNAL:-kafka:19092}"
      TRADES_PER_SECOND: "${TRADES_PER_SECOND:-10}"
      PRICES_PER_SECOND: "${PRICES_PER_SECOND:-1000}"
      SEED: "${SEED:-42}"
      # manual  stay idle until scripts/start-generators.sh is run (default)
      # auto    start with the stack
      # <n>     start n minutes after the stack comes up
      #
      # Manual by default: the graphs going from flat to flowing while people
      # watch is the most persuasive moment in the demo, and a stack that is
      # already busy when it appears gives it away.
      GENERATOR_START: "${GENERATOR_START:-manual}"
    restart: unless-stopped
