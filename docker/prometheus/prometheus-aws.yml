global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules-aws.yml

scrape_configs:
  - job_name: flink-jobmanager
    static_configs:
      - targets: ["jobmanager:9249"]
        labels:
          component: jobmanager

  - job_name: flink-taskmanager
    static_configs:
      - targets: ["taskmanager:9249"]
        labels:
          component: taskmanager

  # MSK open monitoring: one JMX exporter and one node exporter per broker.
  #
  # These hostnames belong to one particular cluster and are regenerated from the
  # bootstrap string whenever it is rebuilt. Left over from an earlier cluster
  # they simply fail to resolve, and the broker panels read zero with nothing to
  # say why -- which is how an AWS run reported 0.00 broker cores while the
  # broker was the whole question.
  # Names differ from the local stack's -- MSK ships its own exporter config, so
  # these arrive as kafka_server_BrokerTopicMetrics_* with a name label rather
  # than the flattened names docker/kafka/jmx-exporter.yml produces. The broker
  # panels on the dashboard therefore stay empty here; the data is present, under
  # different names.
  - job_name: msk-jmx
    static_configs:
      - targets:
          - "b-1.flinktraining.bgihq0.c13.kafka.us-east-1.amazonaws.com:11001"
          - "b-2.flinktraining.bgihq0.c13.kafka.us-east-1.amazonaws.com:11001"
        labels:
          component: broker

  # CPU, disk and network for the broker hosts, which is what answers whether
  # MSK is the ceiling the way one local broker was.
  - job_name: msk-node
    static_configs:
      - targets:
          - "b-1.flinktraining.bgihq0.c13.kafka.us-east-1.amazonaws.com:11002"
          - "b-2.flinktraining.bgihq0.c13.kafka.us-east-1.amazonaws.com:11002"
        labels:
          component: broker
