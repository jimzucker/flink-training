# Scrapes Flink, and cAdvisor for the resources underneath it. Broker health was
# once left out deliberately -- the dashboard is about what the pipeline
# produced, not the plumbing -- but step 10 found the broker to be the pipeline's
# ceiling, and a ceiling you cannot see is one you diagnose by hand.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules-local.yml

scrape_configs:
  - job_name: flink-jobmanager
    static_configs:
      - targets: ["jobmanager:9249"]
        labels:
          component: jobmanager

  - job_name: flink-taskmanager
    static_configs:
      - targets: ["taskmanager:9249"]
        labels:
          component: taskmanager

  # The broker, via a JMX exporter running as an agent inside it.
  - job_name: kafka
    static_configs:
      - targets: ["kafka:9404"]
        labels:
          component: broker

  # End offsets, disk per topic and every consumer group's lag, from the broker.
  - job_name: kafka-metrics
    static_configs:
      - targets: ["kafka-metrics:9500"]
        labels:
          component: kafka-metrics

  # Only there under the "store" profile; the target reads as down otherwise.
  - job_name: store-loader
    static_configs:
      - targets: ["store-loader:9400"]
        labels:
          component: store-loader
