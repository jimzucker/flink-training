# Scrapes Flink and the generators. Kafka is deliberately not scraped: the
# assignment's dashboard is about what the pipeline produced, not broker health.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: flink-jobmanager
    static_configs:
      - targets: ["jobmanager:9249"]
        labels:
          component: jobmanager

  - job_name: flink-taskmanager
    static_configs:
      - targets: ["taskmanager:9249"]
        labels:
          component: taskmanager
