name: CI

# push only on main, pull_request for everything else. Triggering on both for
# every branch runs the whole suite twice on any branch that has a PR open,
# which doubles the runner time and gives no extra signal.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Flink 1.20 does not run on newer JDKs; the build enforces this too.
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Unit tests need nothing; the *IT tests start their own Kafka through
      # Testcontainers, which is why they work on a clean runner with no stack
      # brought up by hand.
      - name: Build, unit tests and integration tests
        run: mvn -B --no-transfer-progress verify

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            generators/target/generators.jar
            jobs/target/jobs.jar
          retention-days: 7
          if-no-files-found: error

  verify-numbers:
    name: Verify the expected numbers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: jars
          path: .

      # --wait excludes the topics service: it is a one-shot that creates the six
      # topics and exits, which --wait would read as a failed service.
      # verify-run.sh recreates the topics it needs anyway.
      - name: Start Kafka, Flink and the dashboard
        run: |
          docker compose -f docker/compose.yml up -d --wait \
            kafka jobmanager taskmanager prometheus grafana renderer
          docker compose -f docker/compose.yml ps
          # A task manager registers a moment after its container is up; without
          # a slot the job submission fails with no resources.
          for _ in $(seq 1 40); do
            slots=$(curl -sf http://localhost:8081/overview | jq -r '."slots-total"' || echo 0)
            [ "$slots" -ge 1 ] && break
            sleep 3
          done
          curl -sf http://localhost:8081/overview | jq -c '{taskmanagers, slots: ."slots-total"}'

      # The gate that matters: the assignment's expected-output table, asserted
      # against what actually lands on the topics -- inputs and both position
      # sinks, including that the two aggregations reconcile. Exact, no
      # tolerances.
      - name: Run and verify
        run: ./scripts/verify-run.sh

      # The dashboard is how the numbers are shown to anyone. Every panel query
      # names a Flink operator, so renaming one silently blanks a panel with
      # nothing failing and nothing logged -- which is only noticed by looking,
      # and during a demo that is too late.
      - name: Verify the dashboard
        run: ./scripts/verify-dashboard.sh

      - name: Upload the dashboard image
        if: always()
        run: ./scripts/capture-dashboard.sh || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard
          path: docs/steps/step-06/dashboard.png
          if-no-files-found: warn
          retention-days: 7

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker/compose.yml logs --tail 300

      - name: Stop the stack
        if: always()
        run: docker compose -f docker/compose.yml down -v

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The verification scripts are part of how correctness is demonstrated, so
      # they get linted rather than trusted.
      - name: ShellCheck
        run: shellcheck scripts/*.sh docker/scripts/*.sh
