<title>Prove It Scales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Single-theme by design: a shareable card, built to sit in a light feed.
     Every colour is painted explicitly so it holds on any host ground. */
  :root{
    --paper:#eef2f1;
    --card:#ffffff;
    --band:#0b6a6e;
    --ink:#0f1f1e;
    --muted:#566766;
    --rule:#d5dedc;
    --accent:#0b6a6e;
    --b1:#8ecac7;
    --b2:#3d9a99;
    --b3:#0b6a6e;
    --disp:"Archivo","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--disp);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding-block:24px 34px;
    padding-left:18px;
    padding-right:18px;
  }
  .card{
    width:100%;
    max-width:1120px;
    background:var(--card);
    border:1px solid var(--rule);
    overflow:hidden;
  }

  .band{
    background:var(--band);
    color:#ffffff;
    padding:30px clamp(24px,3.4vw,40px) 28px;
  }
  h1{
    font-weight:800;
    font-size:clamp(27px,3.7vw,43px);
    line-height:1.04;
    letter-spacing:-.022em;
    margin:0;
    max-width:24ch;
    text-wrap:balance;
  }
  h1 em{font-style:normal;color:#9fd6d5}

  .result{padding:30px clamp(24px,3.4vw,40px) 24px}

  .plot{display:flex;align-items:flex-end;gap:18px}
  .col-bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;min-width:0}
  .chip{
    font-family:var(--mono);
    font-size:14px;
    font-weight:600;
    color:var(--accent);
    min-height:1.2em;
    white-space:nowrap;
  }
  .val{
    font-family:var(--mono);
    font-size:clamp(15px,1.8vw,19px);
    font-weight:500;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
    white-space:nowrap;
  }
  .bar{width:100%;border-radius:5px 5px 0 0}

  .axis{
    display:flex;
    gap:18px;
    margin-top:11px;
    padding-top:11px;
    border-top:1px solid var(--rule);
  }
  .axis div{
    min-width:0;
    font-family:var(--mono);
    /* the columns shrink with the bars; the label must not wrap when they do */
    font-size:clamp(10px,1.2vw,13px);
    font-weight:500;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--muted);
    white-space:nowrap;
    text-align:center;
  }

  .foot{
    border-top:1px solid var(--rule);
    padding:16px clamp(24px,3.4vw,40px) 18px;
    display:flex;
    flex-wrap:wrap;
    gap:8px 30px;
    align-items:baseline;
    justify-content:space-between;
    font-family:var(--mono);
    font-size:clamp(12px,1.4vw,14px);
    color:var(--muted);
  }
  .foot b{font-weight:500;color:var(--accent)}
</style>

<div class="card">

  <header class="band">
    <h1>A free Claude Code skill that builds your data pipeline and <em>proves it scales.</em></h1>
  </header>

  <section class="result">
    <div class="plot">
      <div class="col-bar" style="flex:1">
        <span class="chip">&nbsp;</span>
        <span class="val">58,326</span>
        <div class="bar" style="height:64px;background:var(--b1)"></div>
      </div>
      <div class="col-bar" style="flex:2">
        <span class="chip">2.06&times;</span>
        <span class="val">120,115</span>
        <div class="bar" style="height:132px;background:var(--b2)"></div>
      </div>
      <div class="col-bar" style="flex:4">
        <span class="chip">1.99&times;</span>
        <span class="val">238,804</span>
        <div class="bar" style="height:262px;background:var(--b3)"></div>
      </div>
    </div>

    <div class="axis">
      <div style="flex:1">1 CPU</div>
      <div style="flex:2">2 CPUs</div>
      <div style="flex:4">4 CPUs</div>
    </div>
  </section>

  <footer class="foot">
    <span>Records per second &middot; M1 Pro, 16&nbsp;GB, 8&nbsp;cores</span>
    <b>github.com/jimzucker/scalable-flink-skill</b>
  </footer>

</div>
