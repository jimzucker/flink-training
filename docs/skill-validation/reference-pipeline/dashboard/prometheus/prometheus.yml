global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 30s

scrape_configs:
  - job_name: flink-jobmanager
    static_configs:
      - targets: ["st44-jm:9249"]
        labels: {component: jobmanager}
  - job_name: flink-taskmanager
    static_configs:
      - targets: ["st44-tm:9249"]
        labels: {component: taskmanager}
  - job_name: containers
    static_configs:
      - targets: ["st44-statsexporter:9110"]
